apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kelolakerja
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: regcred-gitlab
      containers:
        - name: backend
          image: registry.gitlab.com/maganghub-wahana-group/kelolakerja/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "db"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "kelolakerja_db"
            - name: DB_USER
              value: "root"
            - name: DB_PASS
              value: "root"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: TOKEN_SECRET
              value: "ganti-dengan-rahasia-acak-minimal-32-karakter-di-produksi"
            - name: FACE_THRESHOLD
              value: "0.42"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kelolakerja
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: backend
