apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kelolakerja-ingress
  namespace: kelolakerja
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kelolakerja.local
      secretName: kelolakerja-tls-secret
  rules:
    - host: kelolakerja.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
