openapi: 3.0.3
info:
  title: KelolaKerja REST API
  description: API Sistem Absensi dan Pelaporan Karyawan Berbasis Face Recognition
  version: 1.0.0
servers:
  - url: /api
    description: Base API Endpoint
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Server operational
  /auth/login:
    post:
      summary: Login pengguna (Admin, Supervisor, Karyawan)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200': { description: Login berhasil }
        '401': { description: Kredensial tidak valid }
  /auth/me:
    get:
      summary: Mendapatkan profil pengguna yang sedang login
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Data profil pengguna }
  /biometric/register:
    post:
      summary: Registrasi vektor embedding wajah karyawan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [embedding]
              properties:
                user_id: { type: string }
                embedding: { type: array, items: { type: number } }
                quality_score: { type: number }
      responses:
        '200': { description: Biometrik berhasil disimpan }
  /attendance/check-in:
    post:
      summary: Absensi masuk karyawan dengan verifikasi wajah
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [embedding, liveness_passed]
              properties:
                embedding: { type: array, items: { type: number } }
                liveness_passed: { type: integer }
                photo_path: { type: string }
      responses:
        '200': { description: Absensi masuk berhasil }
  /attendance/check-out:
    post:
      summary: Absensi pulang karyawan dengan verifikasi wajah
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [embedding, liveness_passed]
              properties:
                embedding: { type: array, items: { type: number } }
                liveness_passed: { type: integer }
      responses:
        '200': { description: Absensi pulang berhasil }
  /reports:
    get:
      summary: Mengambil daftar laporan aktivitas (terfilter role)
      security: [{ bearerAuth: [] }]
    post:
      summary: Membuat laporan aktivitas baru
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, activity_description]
              properties:
                title: { type: string }
                activity_description: { type: string }
                results_achieved: { type: string }
                obstacles: { type: string }
  /admin/users:
    get:
      summary: Daftar karyawan untuk Admin / Supervisor
      security: [{ bearerAuth: [] }]
    post:
      summary: Tambah karyawan baru (Admin only)
      security: [{ bearerAuth: [] }]
  /admin/audit-logs:
    get:
      summary: Jejak audit sistem (Admin only)
      security: [{ bearerAuth: [] }]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

