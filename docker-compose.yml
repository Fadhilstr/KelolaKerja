services:
  db:
    image: mariadb:10.11
    container_name: kelolakerja_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-kelolakerja_db}
    expose:
      - "3306"
    volumes:
      - kelolakerja_db_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kelolakerja_redis
    expose:
      - "6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kelolakerja_backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-kelolakerja_db}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TOKEN_SECRET: ${TOKEN_SECRET:-ganti-dengan-rahasia-acak-minimal-32-karakter-di-produksi}
      FACE_THRESHOLD: ${FACE_THRESHOLD:-0.42}
    expose:
      - "5000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: kelolakerja_gateway
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist/spa:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  kelolakerja_db_data:
    driver: local
